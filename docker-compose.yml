services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bootstrap_scaffold_development
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bootstrap_scaffold_development"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      bash -c "rm -f tmp/pids/server.pid &&
               bin/rails db:prepare &&
               RAILS_ENV=test bin/rails db:prepare &&
               bin/rails tailwindcss:watch &
               bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      # Connect by host so the per-environment database names in config/database.yml
      # apply (dev → _development, test → _test) instead of a single DATABASE_URL
      # forcing every env onto the dev database. DB_USERNAME/DB_PASSWORD default to
      # postgres/postgres, matching the db service above.
      DB_HOST: db
      RAILS_MAX_THREADS: 5
      BINDING: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  pg_data:
  bundle_cache:
