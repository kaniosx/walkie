databases:
  - name: walkie-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: walkie-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: walkie-postgres
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_LOG_LEVEL
        value: info
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      # SOLID_QUEUE_IN_PUMA intentionally unset for free-tier smoke deploy.
      # config/puma.rb treats any non-empty value (including "false") as truthy,
      # so the only way to disable is to omit the env var.
      # Re-add with value: "true" together with Postgres upgrade to Basic-1GB
      # and config/queue.yml tuning.
